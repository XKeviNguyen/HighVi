<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>HighVi</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./i18n.js" defer></script>
    <script src="./rain.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <canvas id="matrix-rain" aria-hidden="true"></canvas>
    <main class="shell">
      <nav class="lang-switch" data-i18n-aria-label="lang.label">
        <button type="button" data-lang="en" lang="en">English</button>
        <button type="button" data-lang="vi" lang="vi">Tiếng Việt</button>
        <button type="button" data-lang="ja" lang="ja">日本語</button>
      </nav>

      <header class="hero">
        <div class="brand-mark" aria-hidden="true">H</div>
        <div>
          <p class="eyebrow" data-i18n="hero.eyebrow"></p>
          <h1>HighVi</h1>
          <p class="subtitle" data-i18n="hero.subtitle"></p>
        </div>
      </header>

      <section id="deps-card" class="error-card hidden" role="alert">
        <strong data-i18n="deps.title"></strong>
        <p id="deps-message"></p>
        <p data-i18n="deps.hint"></p>
      </section>

      <section id="browser-note" class="notice hidden" data-i18n="deps.browserMissing"></section>

      <section class="notice" data-i18n="notice"></section>

      <form id="job-form" class="card">
        <fieldset class="mode-switch">
          <legend data-i18n="mode.legend"></legend>
          <label><input type="radio" name="mode" value="page" checked /> <span data-i18n="mode.page"></span></label>
          <label><input type="radio" name="mode" value="directHls" /> <span data-i18n="mode.direct"></span></label>
        </fieldset>

        <div id="page-fields" class="field-stack">
          <label for="page-url" data-i18n="page.label"></label>
          <input
            id="page-url"
            name="pageUrl"
            type="url"
            inputmode="url"
            autocomplete="off"
            spellcheck="false"
            maxlength="2048"
            placeholder="https://example.com/watch/video"
            required
          />
          <p class="hint" data-i18n="page.hint"></p>
        </div>

        <div id="direct-fields" class="field-stack hidden">
          <label for="playlist-input" data-i18n="playlist.label"></label>
          <input
            id="playlist-input"
            name="playlistUrl"
            type="url"
            inputmode="url"
            autocomplete="off"
            spellcheck="false"
            maxlength="8192"
            placeholder="https://cdn.example.com/video/playlist.m3u8"
          />
          <label for="referer-input" data-i18n="referer.label"></label>
          <input
            id="referer-input"
            name="refererPageUrl"
            type="url"
            inputmode="url"
            autocomplete="off"
            spellcheck="false"
            maxlength="2048"
            placeholder="https://example.com/watch/video"
          />
          <p class="hint" data-i18n="direct.hint"></p>
        </div>

        <div class="actions">
          <button id="download-button" class="primary" type="submit" data-i18n="download.button"></button>
        </div>
        <p class="hint" data-i18n="network.hint"></p>
        <p class="hint" data-i18n="download.hint"></p>
      </form>

      <section id="status-card" class="status card hidden">
        <p id="status-title" class="status-title hidden"></p>
        <div class="status-line">
          <span id="status-dot" class="status-dot" aria-hidden="true"></span>
          <strong id="status-message" aria-live="polite"></strong>
          <span id="status-percent" class="percent"></span>
        </div>
        <div
          id="progress-track"
          class="progress-track"
          role="progressbar"
          data-i18n-aria-label="progress.aria"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="metrics">
          <span id="status-speed"></span>
          <span id="status-eta"></span>
        </div>
        <div class="actions">
          <button id="cancel-button" type="button" data-i18n="cancel.button"></button>
        </div>
      </section>

      <section id="error-card" class="error-card hidden" role="alert">
        <strong data-i18n="error.title"></strong>
        <p id="error-message"></p>
      </section>

      <section id="cancelled-card" class="notice hidden" aria-live="polite" data-i18n="cancelled.title"></section>

      <section id="success-card" class="success-card hidden" aria-live="polite">
        <strong data-i18n="success.title"></strong>
        <p id="saved-path"></p>
        <div class="actions">
          <button id="open-folder-button" type="button" data-i18n="success.open"></button>
        </div>
      </section>
    </main>
  </body>
</html>
