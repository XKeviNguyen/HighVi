<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>HighVi</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./i18n.js" defer></script>
    <script src="./rain.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <canvas id="matrix-rain" aria-hidden="true"></canvas>
    <main class="shell">
      <nav class="lang-switch" data-i18n-aria-label="lang.label">
        <button type="button" data-lang="en" lang="en">English</button>
        <button type="button" data-lang="vi" lang="vi">Tiếng Việt</button>
        <button type="button" data-lang="ja" lang="ja">日本語</button>
      </nav>

      <header class="hero">
        <div class="brand-mark" aria-hidden="true">H</div>
        <div>
          <p class="eyebrow" data-i18n="hero.eyebrow"></p>
          <h1>HighVi</h1>
          <p class="subtitle" data-i18n="hero.subtitle"></p>
        </div>
      </header>

      <section id="deps-card" class="error-card hidden" role="alert">
        <strong id="deps-title"></strong>
        <p id="deps-message"></p>
        <p id="deps-hint"></p>
      </section>

      <section id="browser-note" class="notice hidden" data-i18n="deps.browserMissing"></section>

      <section id="outdated-note" class="notice hidden">
        <p id="outdated-message"></p>
        <p data-i18n="deps.updateHint"></p>
      </section>

      <section class="notice" data-i18n="notice"></section>

      <form id="add-form" class="card">
        <fieldset class="mode-switch">
          <legend data-i18n="mode.legend"></legend>
          <label><input type="radio" name="mode" value="page" checked /> <span data-i18n="mode.page"></span></label>
          <label><input type="radio" name="mode" value="directHls" /> <span data-i18n="mode.direct"></span></label>
        </fieldset>

        <div id="page-fields" class="field-stack">
          <label for="page-urls" data-i18n="page.label"></label>
          <textarea
            id="page-urls"
            name="pageUrls"
            rows="4"
            autocomplete="off"
            spellcheck="false"
            maxlength="200000"
            placeholder="https://example.com/watch/video-1&#10;https://example.com/watch/video-2"
          ></textarea>
          <p class="hint" data-i18n="page.hint"></p>
        </div>

        <div id="direct-fields" class="field-stack hidden">
          <label for="playlist-input" data-i18n="playlist.label"></label>
          <input
            id="playlist-input"
            name="playlistUrl"
            type="url"
            inputmode="url"
            autocomplete="off"
            spellcheck="false"
            maxlength="8192"
            placeholder="https://cdn.example.com/video/playlist.m3u8"
          />
          <label for="referer-input" data-i18n="referer.label"></label>
          <input
            id="referer-input"
            name="refererPageUrl"
            type="url"
            inputmode="url"
            autocomplete="off"
            spellcheck="false"
            maxlength="2048"
            placeholder="https://example.com/watch/video"
          />
          <p class="hint" data-i18n="direct.hint"></p>
        </div>

        <div class="actions">
          <button id="add-button" class="primary" type="submit" data-i18n="add.button"></button>
        </div>
        <p id="add-result" class="add-result hidden" role="status"></p>
        <p class="hint" data-i18n="network.hint"></p>
        <p class="hint" data-i18n="download.hint"></p>
      </form>

      <section id="queue-card" class="card queue" aria-labelledby="queue-title">
        <div class="queue-head">
          <h2 id="queue-title" data-i18n="queue.title"></h2>
          <p id="queue-status" class="queue-status" aria-live="polite"></p>
        </div>

        <div class="queue-controls">
          <button id="start-button" class="primary" type="button" data-i18n="queue.start"></button>
          <fieldset class="concurrency" id="concurrency">
            <legend data-i18n="queue.concurrency"></legend>
            <label><input type="radio" name="concurrency" value="1" /> <span>1</span></label>
            <label><input type="radio" name="concurrency" value="2" checked /> <span>2</span></label>
            <label><input type="radio" name="concurrency" value="3" /> <span>3</span></label>
            <label><input type="radio" name="concurrency" value="4" /> <span>4</span></label>
          </fieldset>
        </div>
        <p id="queue-counts" class="queue-counts"></p>
        <p id="queue-paused" class="notice hidden" role="alert"></p>

        <ul id="job-list" class="job-list" data-i18n-aria-label="queue.listLabel"></ul>
        <p id="queue-empty" class="hint" data-i18n="queue.empty"></p>

        <div class="actions queue-actions">
          <button id="cancel-all-button" type="button" data-i18n="queue.cancelAll"></button>
          <button id="retry-failed-button" type="button" data-i18n="queue.retryFailed"></button>
          <button id="clear-button" type="button" data-i18n="queue.clearCompleted"></button>
          <button id="open-folder-button" type="button" data-i18n="success.open"></button>
        </div>
      </section>

      <section id="error-card" class="error-card hidden" role="alert">
        <strong data-i18n="error.title"></strong>
        <p id="error-message"></p>
      </section>
    </main>

    <template id="job-template">
      <li class="job">
        <div class="job-head">
          <span class="job-dot" aria-hidden="true"></span>
          <strong class="job-title"></strong>
          <span class="job-percent"></span>
        </div>
        <p class="job-status"></p>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar"></div>
        </div>
        <p class="job-metrics"></p>
        <p class="job-error hidden"></p>
        <p class="job-hint hidden"></p>
        <p class="job-saved hidden"></p>
        <div class="diagnostics hidden">
          <div class="actions">
            <button class="copy-diagnostics" type="button"></button>
            <span class="copy-status hint" aria-live="polite"></span>
          </div>
          <details>
            <summary></summary>
            <pre tabindex="0"></pre>
          </details>
        </div>
        <div class="actions job-actions">
          <button class="job-cancel" type="button"></button>
          <button class="job-retry" type="button"></button>
          <button class="job-browser" type="button"></button>
          <button class="job-remove" type="button"></button>
        </div>
      </li>
    </template>
  </body>
</html>
