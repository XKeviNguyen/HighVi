name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt · clippy · test · ui
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev ffmpeg

      # End-to-end tests run the real downloader against a local HTTPS
      # fixture; pin it so a yt-dlp release cannot silently change results.
      - name: Install yt-dlp
        run: |
          pipx install "yt-dlp[default]==2026.3.17"
          yt-dlp --version
          ffmpeg -hide_banner -version | head -1

      # Browser-discovery tests drive the runner's Google Chrome with its
      # sandbox ON. Ubuntu 24.04 restricts unprivileged user namespaces,
      # which the sandbox needs; relax that on this throwaway VM only.
      - name: Chrome with sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          google-chrome --version

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        env:
          HIGHVI_REQUIRE_E2E: "1"
        run: cargo test --workspace --locked

      - name: JavaScript syntax
        run: |
          node --check ui/app.js
          node --check ui/i18n.js
          node --check ui/rain.js

      - name: UI catalogue parity
        run: node scripts/check-ui.mjs

  audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      # Fails on known vulnerabilities; "unmaintained"/"unsound" warnings in
      # Tauri's GTK stack are reported but do not fail the build.
      - name: cargo audit
        run: cargo audit

  package:
    name: .deb bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Build the .deb
        run: |
          npm ci --ignore-scripts
          npx tauri build --bundles deb

      - name: Check the package
        run: |
          deb=$(ls target/release/bundle/deb/*.deb)
          dpkg-deb -I "$deb"
          dpkg-deb -f "$deb" Depends | grep -q 'yt-dlp'
          dpkg-deb -f "$deb" Depends | grep -q 'ffmpeg'
          files=$(dpkg-deb -c "$deb" | awk '{print $6}' | sed 's|^\./||')
          echo "$files" | grep -qx 'usr/bin/highvi'
          echo "$files" | grep -qx 'usr/share/applications/HighVi.desktop'
