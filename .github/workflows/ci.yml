name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt · clippy · test · ui
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev ffmpeg

      # End-to-end tests run the real downloader against a local HTTPS
      # fixture; pin it so a yt-dlp release cannot silently change results.
      - name: Install yt-dlp
        run: |
          pipx install "yt-dlp[default]==2026.3.17"
          yt-dlp --version
          ffmpeg -hide_banner -version | head -1

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        env:
          HIGHVI_REQUIRE_E2E: "1"
        run: cargo test --workspace --locked

      - name: JavaScript syntax
        run: |
          node --check ui/app.js
          node --check ui/i18n.js
          node --check ui/rain.js

      - name: UI catalogue parity
        run: node scripts/check-ui.mjs
